[[requirement]]
id = "deviation.floats"
upstream = "docs/templates.rst#literals"
title = "Float literals are exact decimals, not binary doubles"
status = "deviation"
note = "Arithmetic on float literals is exact; repr of results can differ from Python's binary floats."

[[requirement]]
id = "deviation.imports"
upstream = "docs/templates.rst#import"
title = "import / from ... import, *args/**kwargs in macros, line statements"
status = "excluded"

[[requirement]]
id = "deviation.globals"
upstream = "docs/templates.rst#list-of-global-functions"
title = "cycler, joiner, lipsum, random, urlize"
status = "excluded"

[[requirement]]
id = "deviation.autoescape-callable"
upstream = "docs/api.rst#autoescaping"
title = "autoescape is a constant or select_autoescape, not an arbitrary callable"
status = "deviation"
note = "Upstream accepts any callable; here it is the AutoescapePolicy data type."

[[requirement]]
id = "deviation.unicode"
upstream = "docs/templates.rst#filters"
title = "Case mapping is ASCII/Latin-1; identifiers approximate Python's unicode rule; no \\N{...} escapes"
status = "deviation"

[[requirement]]
id = "sandbox.max-range"
upstream = "tests/test_api.py::TestExtendedAPI::test_sandbox_max_range"
title = "range refuses more than MAX_RANGE (100000) items with OverflowError"
status = "implemented"
realises = ["LeanJinja2.rangeFn", "LeanJinja2.maxRange"]
test = ["tests/Conformance.lean", "tests/Bench.lean"]

[[requirement]]
id = "deviation.string-escapes"
upstream = "tests/test_lexnparse.py::TestLexer::test_string_escapes"
title = "An unknown escape keeps its backslash before any character (UP-047)"
status = "deviation"
realises = ["LeanJinja2.Lex.unescapeStr"]
test = ["tests/Conformance.lean"]
note = "Upstream keeps the backslash before an ASCII character ('\\q' renders \\q) but turns '\\é' into the text \\xe9, because it decodes with backslashreplace then unicode-escape. Here '\\é' renders \\é. Recorded as upstream defect UP-047."

[[requirement]]
id = "filters.title-markup"
upstream = "tests/test_filters.py::TestFilter::test_title"
title = "title on markup returns a plain string, escaped again under autoescape (UP-048)"
status = "implemented"
realises = ["LeanJinja2.Filters.title"]
test = ["tests/Conformance.lean"]
note = "Follows upstream byte for byte, including the double escape recorded as upstream defect UP-048."

[[requirement]]
id = "safety.linear"
upstream = "src/jinja2/lexer.py (Lexer.tokeniter), src/jinja2/parser.py"
title = "Lexing, parsing and rendering are linear in the template; deep nesting fails fast"
status = "tested"
realises = ["LeanJinja2.Lex.loop", "LeanJinja2.renderNodes", "LeanJinja2.loopValues", "LeanJinja2.renderBudget"]
theorem = ["LeanJinja2.loopValues_eq", "LeanJinja2.lex_print_roundtrip"]
test = ["tests/Bench.lean"]
note = "Complexity is not stated in Lean; lake exe bench bounds the time at 10^4 and 10^5 nesting (if, for, unclosed if, parentheses, sibling tags) and for range."

[[requirement]]
id = "safety.large-input"
upstream = "src/jinja2/lexer.py (Lexer.tokeniter, _normalize_newlines), src/jinja2/environment.py (Environment.compile)"
title = "Large templates and values render in linear time, constant stack and memory a small multiple of the input"
status = "tested"
realises = ["LeanJinja2.lexFast", "LeanJinja2.LexF.loop", "LeanJinja2.LexF.cutData", "LeanJinja2.LexF.strValue", "LeanJinja2.Lex.unescF", "LeanJinja2.normalizeNewlinesTR", "LeanJinja2.escapeFast", "LeanJinja2.Environment.compile", "LeanJinja2.parse"]
theorem = ["LeanJinja2.lexFast_eq", "LeanJinja2.parse_eq", "LeanJinja2.normalizeNewlines_eq_TR", "LeanJinja2.Lex.unescapeStr_eq_TR", "LeanJinja2.escape_eq_fast"]
test = ["tests/Bench.lean"]
note = "The compiler lexes in place over the source (String.Slice positions, data built into a String) and lexFast_eq proves it equal to the List Char specification lexer. Time, stack and memory are not stated in Lean; lake exe bench bounds 10 MB and 20 MB of plain text, {{ x }} with a 20 MB string (plain and autoescaped; escape runs escapeFast through the proved @[csimp] escape_eq_fast) and a 10 MB string literal at 2 s and 300 MB peak resident memory."
