test = ["tests/Conformance.lean", "tests/Bench.lean"]
note = "Both theorems hold for every LexConfig, line prefixes included. A prefix must be non-empty (LexConfig.h_lineNonempty); upstream accepts an empty one, which matches at every line."

[[requirement]]
id = "globals.cycler-joiner"
upstream = "tests/test_api.py::TestExtendedAPI::test_cycler"
title = "cycler(*items) with next(), reset(), current, items, pos; joiner(sep) returning '' then sep"
status = "tested"
realises = ["LeanJinja2.callV", "LeanJinja2.pyAttr", "LeanJinja2.builtinGlobals"]
theorem = ["LeanJinja2.render_total"]
test = ["tests/Conformance.lean", "tests/Bench.lean"]
note = "Both are heap cells (Value.cycler, Value.joiner), like namespace(). render_total covers templates that call them (callableGlobals). Upstream's messages for wrong arguments are kept. lake exe bench bounds 10^5 cycler.next() and 10^5 joiner() calls at 500 ms."

[[requirement]]
id = "deviation.random"
upstream = "src/jinja2/filters.py::do_random"
title = "random and lipsum draw from an explicit seeded source"
status = "deviation"
realises = ["LeanJinja2.randomChoice", "LeanJinja2.lipsum", "LeanJinja2.lipsumCall", "LeanJinja2.SplitMix.next", "LeanJinja2.applyFilterM", "LeanJinja2.Filters.random"]
theorem = ["LeanJinja2.SplitMix.below_lt"]
test = ["tests/Props.lean", "tests/Conformance.lean", "tests/Bench.lean"]
note = "SplitMix64 seeded by Environment.randomSeed, state in heap cell 0; a render is deterministic, upstream's is not. lipsum follows generate_lorem_ipsum's paragraph, comma and full-stop rules with its own Latin words; lipsumProp checks n paragraphs, the word-count bounds of test_lorem_ipsum_min/max, no word twice in a row and the <p> markup. randomProp checks the pick is an item. Inside map('random') items share one draw state. Benches: lipsum(2000) 300 ms, 10^5 |random 700 ms."

[[requirement]]
id = "filters.urlize"
upstream = "tests/test_filters.py::TestFilter::test_urlize"
title = "urlize: links, mailto and email addresses, rel/target/nofollow, trim_url_limit, extra_schemes and the urlize.* policies"
status = "tested"
realises = ["LeanJinja2.Filters.urlize", "LeanJinja2.urlizeText", "LeanJinja2.httpMatch", "LeanJinja2.emailMatch", "LeanJinja2.uriSchemeOk", "LeanJinja2.balance"]
test = ["tests/Conformance.lean", "tests/Bench.lean"]
note = "Upstream's regexes are decided directly, one linear pass per word (each is anchored at both ends and the host must end at the first character outside its alphabet). 8021 generated words agreed with jinja2 3.1.6. Keeps UP-059 (an upper-case scheme gets https:// prepended). \\w is isIdentChar and \\d an ASCII digit. Benches: 1 MB of text 500 ms, a 1 MB word 300 ms, 10^5 brackets 200 ms."

[[requirement]]
id = "filters.groupby-tuple"
upstream = "src/jinja2/filters.py::_GroupTuple"
title = "groupby items are named tuples with .grouper and .list that print and compare as tuples"
status = "tested"
realises = ["LeanJinja2.Filters.groupby", "LeanJinja2.pyAttr", "LeanJinja2.Value.pyEq"]
test = ["tests/Conformance.lean"]

[[requirement]]
id = "render.call-result"
upstream = "docs/templates.rst#working-with-automatic-escaping"
title = "Under autoescape, macro call results and imported modules are not escaped twice"
status = "implemented"
realises = ["LeanJinja2.wrapText", "LeanJinja2.callMacro"]
theorem = ["LeanJinja2.call_result_passthrough", "LeanJinja2.autoescape_sound"]
test = ["tests/Conformance.lean"]
note = "autoescape_sound has no hypothesis on macros or imports: its invariant is proved over the whole mutual renderer (callMacro, call blocks, include, import, from-import), and AutoescapeAlways covers every template the loader holds. call_result_passthrough states what an interpolated call result or module contributes."

[[requirement]]
id = "deviation.autoescape-callable"
upstream = "docs/api.rst#autoescaping"
title = "autoescape is a constant or select_autoescape, not an arbitrary callable"
status = "deviation"
note = "Upstream accepts any callable; here it is the AutoescapePolicy data type."

[[requirement]]
id = "deviation.unicode"
upstream = "docs/templates.rst#filters"
title = "Case mapping is ASCII/Latin-1; identifiers approximate Python's unicode rule; no \\N{...} escapes"
status = "deviation"

[[requirement]]
id = "sandbox.max-range"
upstream = "tests/test_api.py::TestExtendedAPI::test_sandbox_max_range"
title = "range refuses more than MAX_RANGE (100000) items with OverflowError"
status = "implemented"
realises = ["LeanJinja2.rangeFn", "LeanJinja2.maxRange"]
test = ["tests/Conformance.lean", "tests/Bench.lean"]

[[requirement]]
id = "deviation.string-escapes"
upstream = "tests/test_lexnparse.py::TestLexer::test_string_escapes"
title = "An unknown escape keeps its backslash before any character (UP-047)"
status = "deviation"
realises = ["LeanJinja2.Lex.unescapeStr"]
test = ["tests/Conformance.lean"]
note = "Upstream keeps the backslash before an ASCII character ('\\q' renders \\q) but turns '\\é' into the text \\xe9, because it decodes with backslashreplace then unicode-escape. Here '\\é' renders \\é. Recorded as upstream defect UP-047."

[[requirement]]
id = "filters.title-markup"
upstream = "tests/test_filters.py::TestFilter::test_title"
title = "title on markup returns a plain string, escaped again under autoescape (UP-048)"
status = "implemented"
realises = ["LeanJinja2.Filters.title"]
test = ["tests/Conformance.lean"]
note = "Follows upstream byte for byte, including the double escape recorded as upstream defect UP-048."

[[requirement]]
id = "safety.linear"
upstream = "src/jinja2/lexer.py (Lexer.tokeniter), src/jinja2/parser.py"
title = "Lexing, parsing and rendering are linear in the template; deep nesting fails fast"
status = "tested"
realises = ["LeanJinja2.Lex.loop", "LeanJinja2.renderNodes", "LeanJinja2.loopValues", "LeanJinja2.renderBudget"]
theorem = ["LeanJinja2.loopValues_eq", "LeanJinja2.lex_print_roundtrip"]
test = ["tests/Bench.lean"]
note = "Complexity is not stated in Lean; lake exe bench bounds the time at 10^4 and 10^5 nesting (if, for, unclosed if, parentheses, sibling tags) and for range."

[[requirement]]
id = "safety.large-input"
upstream = "src/jinja2/lexer.py (Lexer.tokeniter, _normalize_newlines), src/jinja2/environment.py (Environment.compile)"
title = "Large templates and values render in linear time, constant stack and memory a small multiple of the input"
status = "tested"
realises = ["LeanJinja2.lexFast", "LeanJinja2.LexF.loop", "LeanJinja2.LexF.cutData", "LeanJinja2.LexF.strValue", "LeanJinja2.Lex.unescF", "LeanJinja2.normalizeNewlinesTR", "LeanMarkupsafe.escapeFast", "LeanJinja2.Environment.compile", "LeanJinja2.parse"]
theorem = ["LeanJinja2.lexFast_eq", "LeanJinja2.parse_eq", "LeanJinja2.normalizeNewlines_eq_TR", "LeanJinja2.Lex.unescapeStr_eq_TR", "LeanMarkupsafe.escape_eq_fast"]
test = ["tests/Bench.lean"]
note = "The compiler lexes in place over the source (String.Slice positions, data built into a String) and lexFast_eq proves it equal to the List Char specification lexer. Time, stack and memory are not stated in Lean; lake exe bench bounds 10 MB and 20 MB of plain text, {{ x }} with a 20 MB string (plain and autoescaped; escape runs lean-markupsafe's escapeFast through its proved @[csimp] escape_eq_fast) and a 10 MB string literal at 2 s and 300 MB peak resident memory."

[[requirement]]
id = "safety.value-ops"
upstream = "src/jinja2/filters.py"
title = "Slicing, unique, repr of containers, the slice filter and string indexing run in one pass"
status = "tested"
realises = ["LeanJinja2.sliceV", "LeanJinja2.slicePick", "LeanJinja2.uniqueFast", "LeanJinja2.Value.reprAcc", "LeanJinja2.strIndex"]
theorem = ["LeanJinja2.unique_eq_fast", "LeanJinja2.repr_eq_acc", "LeanJinja2.bkey_of_pyEq"]
test = ["tests/Bench.lean", "tests/Props.lean", "tests/Conformance.lean"]
note = "unique_eq_fast and repr_eq_acc are @[csimp] equalities with the list-based definitions. The array-based sliceV is checked against indexing the slice indices by a property (sliceProp). Time is not stated in Lean: lake exe bench bounds x[1:], x[::-1] and x[::2] on 10^6 items and a 10 MB string at 500 ms, unique of 10^5 ints at 200 ms, {{ x }} and pprint of 10^6 ints at 1 s, slice(10^5) at 500 ms and 10^4 string indexes at 1 s. Indexing x[i] into a list or string is O(i) (a list, UTF-8 text), so a template loop that indexes every position of a large value is quadratic, where Python is linear."
