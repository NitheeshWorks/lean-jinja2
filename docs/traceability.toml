note = "Behaviour of the call protocol is tested against upstream's macro, call-block and regression tests; the parser's argument-order rules are upstream's parse_call_args checks, with a case for each."

[[requirement]]
id = "syntax.line-statements"
upstream = "tests/test_lexnparse.py::TestLexer::test_line_syntax"
title = "Line statements and line comments (line_statement_prefix, line_comment_prefix), in both lexers"
status = "implemented"
